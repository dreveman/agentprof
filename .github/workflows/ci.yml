name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traces:
    name: Recorder and trace validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PERFETTO_TRACE_PROCESSOR: ${{ github.workspace }}/third_party/src/perfetto/tools/trace_processor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Set up pinned Perfetto Trace Processor
        run: python3 tools/perfetto setup
      - name: Typecheck recorder and example
        run: npm run check
      - name: Test recorder and trace import
        run: npm test
      - name: Validate recorded and generated examples
        run: npm run check:example
      - name: Check bundled example is current
        run: git diff --exit-code -- 'third_party/overlays/perfetto/ui/src/plugins/dev.agentprof.Agentprof/*example_trace.ts'

  node-runtime:
    name: Recording runtimes (Node ${{ matrix.node }})
    needs: traces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['16.20.2', '22']
    env:
      PERFETTO_TRACE_PROCESSOR: ${{ github.workspace }}/third_party/src/perfetto/tools/trace_processor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Set up pinned Perfetto Trace Processor
        run: python3 tools/perfetto setup
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Bun runs the TypeScript tests; packaged hooks, MCP servers and writer
      # subprocesses resolve node from PATH and use the selected runtime.
      - name: Test packaged recording runtimes
        run: |
          node --version
          npm run test:node-runtime

  ui:
    name: Build and test UI
    needs: traces
    # Perfetto v59.1 pins Playwright 1.58.2, which supports up to Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Set up pinned Perfetto checkout
        run: python3 tools/perfetto setup
      - name: Generate browser trace fixtures
        run: npm run check:example
      # Restore caches after setup: the checkout manager refuses a nonempty
      # directory without its own .git metadata.
      - name: Cache Perfetto UI dependencies
        uses: actions/cache@v4
        with:
          path: |
            third_party/src/perfetto/buildtools
            third_party/src/perfetto/third_party/pnpm
            third_party/src/perfetto/ui/node_modules
            artifacts/browsers
          key: perfetto-ui-${{ runner.os }}-${{ hashFiles('third_party/perfetto.toml') }}
      - name: Build UI and Trace Processor WASM
        run: python3 tools/perfetto build-ui
      - name: Check authored AgentProf SQL formatting
        run: python3 tools/perfetto check-skills-format --skip-deps
      - name: Typecheck UI
        run: python3 tools/perfetto check-ui --skip-deps
      - name: Install Chromium and system dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/artifacts/browsers
        run: third_party/src/perfetto/ui/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser smoke test
        run: python3 tools/perfetto smoke-ui
      - name: Stage iOS web UI bundle
        run: python3 ios/scripts/prepare_web_ui.py
      - name: Upload staged iOS web UI bundle
        uses: actions/upload-artifact@v4
        with:
          name: agentprof-ios-web-ui
          path: ios/build/AgentProfWeb
          retention-days: 1
      - name: Upload browser screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agentprof-ui-screenshots
          path: artifacts/screenshots/
          if-no-files-found: ignore

  ios:
    name: Build and test iOS app
    needs: ui
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 or newer
        run: |
          python3 - <<'PY'
          import glob, re, subprocess
          cur = subprocess.check_output(["xcodebuild", "-version"], text=True)
          m = re.search(r"Xcode (\d+)", cur)
          if m and int(m.group(1)) >= 16:
              raise SystemExit(0)
          candidates = []
          for app in sorted(glob.glob("/Applications/Xcode*.app")):
              if "beta" in app.lower():
                  continue
              try:
                  out = subprocess.check_output(
                      [f"{app}/Contents/Developer/usr/bin/xcodebuild", "-version"], text=True
                  )
              except Exception:
                  continue
              vm = re.search(r"Xcode (\d+)\.(\d+)", out)
              if vm and int(vm.group(1)) >= 16:
                  candidates.append(((int(vm.group(1)), int(vm.group(2))), app))
          if candidates:
              candidates.sort()
              chosen = candidates[-1][1]
              subprocess.run(["sudo", "xcode-select", "-s", f"{chosen}/Contents/Developer"], check=True)
          PY
          xcodebuild -version
      - name: Select iPhone Simulator
        id: sim
        run: |
          SIM_ID="$(python3 - <<'PY'
          import json, re, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              rm = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not rm or int(rm.group(1)) < 18:
                  continue
              ver = (int(rm.group(1)), int(rm.group(2)))
              for dev in devices:
                  if dev.get("isAvailable") and "iPhone" in dev.get("name", ""):
                      candidates.append((ver, dev["name"], dev["udid"]))
          if not candidates:
              sys.exit("No available iOS 18+ iPhone simulator found")
          candidates.sort()
          print(candidates[-1][2])
          PY
          )"
          echo "udid=${SIM_ID}" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "${SIM_ID}" || true
      - name: Test prepare_web_ui.py
        run: python3 -m unittest discover -s ios/scripts -p 'test_*.py'
      - name: Verify placeholder build
        run: |
          xcodebuild build-for-testing \
            -project ios/AgentProf.xcodeproj \
            -scheme AgentProf \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
      - name: Download staged AgentProfWeb bundle
        uses: actions/download-artifact@v4
        with:
          name: agentprof-ios-web-ui
          path: ios/build/AgentProfWeb
      - name: Run iOS unit and bundled UI tests
        run: |
          xcodebuild test \
            -project ios/AgentProf.xcodeproj \
            -scheme AgentProf \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

  claude-plugin:
    name: Claude plugin installation and controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tested Claude mod host
        run: npm install --global @anthropic-ai/claude-code@2.1.289
      - name: Validate, install and test plugin without model credentials
        run: npm run check:claude-plugin

  codex-plugin:
    name: Codex plugin installation and tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tested Codex host
        run: npm install --global @openai/codex@0.160.0
      - name: Validate plugin and profile without model credentials
        run: npm run check:codex-plugin
